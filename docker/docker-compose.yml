services:
  # === S1: NGINX Proxy Inverso + Balanceo ===
  s1-lb:
    build: ./s1-nginx
    container_name: s1-lb
    ports:
      - "90:90"
    networks:
      - frontend
      - backend
    depends_on:
      - s2-php
      - s3-php
      - s4-upload
      - s5-storage
      - s6-static
      - s7-mysql

  # === S2: PHP-FPM (extagram.php, login.php, logout.php) ===
  s2-php:
    build: ./s2-php
    container_name: s2-php
    volumes:
      - ./s2-php:/var/www/html
    networks:
      - backend

  # === S3: PHP-FPM (réplica para balanceo) ===
  s3-php:
    build: ./s3-php
    container_name: s3-php
    volumes:
      - ./s3-php:/var/www/html
    networks:
      - backend

  # === S4: PHP-FPM (upload.php) ===
  s4-upload:
    build: ./s4-upload
    container_name: s4-upload
    volumes:
      - ./s4-upload:/var/www/html
      - uploads-volume:/var/www/html/uploads
    networks:
      - backend

  # === S5: NGINX (servir imágenes subidas) ===
  s5-storage:
    build: ./s5-storage
    container_name: s5-storage
    volumes:
      - uploads-volume:/usr/share/nginx/html/uploads:ro
    networks:
      - frontend

  # === S6: NGINX (servir CSS/SVG) ===
  s6-static:
    build: ./s6-static
    container_name: s6-static
    networks:
      - frontend

  # === S7: MySQL ===
  s7-mysql:
    image: mysql:8.0
    container_name: s7-mysql
    environment:
      MYSQL_ROOT_PASSWORD: rootpass123
      MYSQL_DATABASE: extagram_db
      MYSQL_USER: extagram_admin
      MYSQL_PASSWORD: pass123
    networks:
      - backend
    volumes:
      - mysql-data:/var/lib/mysql
      - ./s7-mysql/init.sql:/docker-entrypoint-initdb.d/init.sql

volumes:
  uploads-volume:
  mysql-data:

networks:
  frontend:
    driver: bridge
  backend:
    driver: bridge
